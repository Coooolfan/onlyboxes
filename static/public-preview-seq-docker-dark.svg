<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 1100 580" width="100%" height="100%" style="background-color: #0A0A0A; font-family: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#333333" />
    </pattern>
    <filter id="shadow-sm" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFFFFF"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999999"/>
    </marker>
    <radialGradient id="fade-gradient" cx="50%" cy="50%" r="60%">
      <stop offset="30%" stop-color="white" stop-opacity="1" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </radialGradient>
    <mask id="dot-mask">
      <rect width="1100" height="700" fill="url(#fade-gradient)" />
    </mask>
  </defs>

  <rect width="1100" height="700" fill="url(#dot-grid)" mask="url(#dot-mask)" />

  <!-- Actor: Browser -->
  <g transform="translate(50, 130)">
    <rect width="200" height="70" rx="8" fill="#141414" stroke="#2A2A2A" stroke-width="1" filter="url(#shadow-sm)"/>
    <rect x="14" y="14" width="42" height="42" rx="6" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>
    <svg x="21" y="21" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#EDEDED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
    </svg>
    <text x="66" y="32" font-size="12" font-weight="600" fill="#666666" letter-spacing="1.5">ACTOR</text>
    <text x="66" y="54" font-size="17" font-weight="500" fill="#EDEDED">Browser</text>
  </g>

  <!-- Actor: Nginx -->
  <g transform="translate(330, 130)">
    <rect width="200" height="70" rx="8" fill="#141414" stroke="#2A2A2A" stroke-width="1" filter="url(#shadow-sm)"/>
    <rect x="14" y="14" width="42" height="42" rx="6" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>
    <svg x="21" y="21" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#EDEDED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/>
    </svg>
    <text x="66" y="32" font-size="12" font-weight="600" fill="#666666" letter-spacing="1.5">GATEWAY</text>
    <text x="66" y="54" font-size="17" font-weight="500" fill="#EDEDED">Nginx</text>
  </g>

  <!-- Actor: Console -->
  <g transform="translate(610, 130)">
    <rect width="200" height="70" rx="8" fill="#141414" stroke="#2A2A2A" stroke-width="1" filter="url(#shadow-sm)"/>
    <rect x="14" y="14" width="42" height="42" rx="6" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>
    <svg x="21" y="21" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#EDEDED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
    </svg>
    <text x="66" y="32" font-size="12" font-weight="600" fill="#666666" letter-spacing="1.5">CONTROL</text>
    <text x="66" y="54" font-size="17" font-weight="500" fill="#EDEDED">Console</text>
  </g>

  <!-- Actor 4 -->
  <g transform="translate(890, 130)">
    <rect width="200" height="70" rx="8" fill="#141414" stroke="#2A2A2A" stroke-width="1" filter="url(#shadow-sm)"/>
    <rect x="14" y="14" width="42" height="42" rx="6" fill="#1A1A1A" stroke="#2A2A2A" stroke-width="1"/>
    <svg x="21" y="21" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#EDEDED" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="14" width="16" height="6" rx="1"/><rect x="8" y="8" width="8" height="6" rx="1"/>
    </svg>
    <text x="66" y="32" font-size="12" font-weight="600" fill="#666666" letter-spacing="1.5">DATA PLANE</text>
    <text x="66" y="54" font-size="17" font-weight="500" fill="#EDEDED">Worker :8091</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#333333" stroke-width="1.5" stroke-dasharray="4 6" fill="none">
    <line x1="150" y1="210" x2="150" y2="640"/>
    <line x1="430" y1="210" x2="430" y2="640"/>
    <line x1="710" y1="210" x2="710" y2="640"/>
    <line x1="990" y1="210" x2="990" y2="640"/>
  </g>

  <!-- 1: Browser -> Nginx -->
  <line x1="154" y1="270" x2="424" y2="270" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="289" y="260" text-anchor="middle" font-size="15" font-weight="500" fill="#EDEDED">GET https://&lt;route-key&gt;.public-preview.example.com/</text>

  <!-- 2: Nginx -> Console -->
  <line x1="434" y1="340" x2="704" y2="340" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="569" y="330" text-anchor="middle" font-size="15" font-weight="500" fill="#EDEDED">auth_request /internal/v1/proxy/resolve</text>

  <!-- 3: Console -> Nginx -->
  <line x1="704" y1="410" x2="434" y2="410" stroke="#999999" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
  <text x="569" y="400" text-anchor="middle" font-size="15" font-weight="500" fill="#999999">200 { upstream, route_token }</text>

  <!-- 4: Nginx -> Worker -->
  <line x1="434" y1="480" x2="984" y2="480" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="709" y="470" text-anchor="middle" font-size="15" font-weight="500" fill="#EDEDED">proxy_pass + x-onlyboxes-route-token</text>

  <!-- 5: Worker self-loop -->
  <path d="M 994 520 L 1050 520 L 1050 550 L 998 550" fill="none" stroke="#FFFFFF" stroke-width="2" marker-end="url(#arrow-solid)"/>
  <text x="1060" y="540" font-size="13" font-weight="500" fill="#999999">resolve session &#8594; host port</text>

  <!-- 6: Worker -> Nginx -->
  <line x1="984" y1="590" x2="434" y2="590" stroke="#999999" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
  <text x="709" y="580" text-anchor="middle" font-size="15" font-weight="500" fill="#999999">response</text>

  <!-- 7: Nginx -> Browser -->
  <line x1="424" y1="640" x2="154" y2="640" stroke="#999999" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>
  <text x="289" y="630" text-anchor="middle" font-size="15" font-weight="500" fill="#999999">response</text>
</svg>
