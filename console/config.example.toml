# console configuration file.
# Place this file next to the console binary as `config.toml`,
# or point `CONSOLE_CONFIG_FILE` at it.
# Environment variables always win over the values declared here.

# Listeners.
http_addr = ":8089"
grpc_addr = ":50051"

# Persistence.
db_path = "./db/onlyboxes-console.db"
db_busy_timeout_ms = 5000
task_retention_days = 30

# Secrets (leave empty to keep them out of the file and use env vars instead).
dashboard_username = ""
dashboard_password = ""
initial_admin_api_key = ""
jit_signing_key = ""
dashboard_jit_signing_key = ""
hash_key = ""

# Worker session policy.
offline_ttl_sec = 15
replay_window_sec = 60
heartbeat_interval_sec = 5
# REPLACE | REJECT
worker_connection_conflict_policy = "REPLACE"

# Dashboard registration.
enable_registration = false

# Public preview proxy. Keep disabled until Nginx and worker ingress are ready.
proxy_enabled = false
proxy_public_base_domain = "public-preview.example.com"
# http | https; use http only for trusted local development.
proxy_public_scheme = "https"
# Prefer CONSOLE_PROXY_INTERNAL_AUTH_TOKEN instead of storing this secret here.
proxy_internal_auth_token = ""
proxy_allowed_worker_cidrs = ["10.0.0.0/8"]
proxy_allowed_worker_ports = [8091]
# Direct E2B origins must be subdomains of one of these suffixes.
proxy_allowed_direct_domains = ["e2b.app"]
# Maximum 604800 (7 days).
proxy_route_ttl_sec = 86400
# Generated route key length, 8..26. Values below 16 are intended only for
# trusted local or low-risk deployments.
proxy_route_key_length = 26
# Maximum active routes retained for one account and one session.
proxy_route_max_per_account = 16
proxy_route_max_per_session = 2

# Export file object storage. Export is enabled only when every field is set.
export_file_endpoint = ""
export_file_region = ""
export_file_bucket_name = ""
export_file_export_prefix = ""
export_file_ak = ""
export_file_sk = ""
export_file_upload_presign_ttl_sec = 900
export_file_download_presign_ttl_sec = 3600
# ALL | SIGNED_URL | OBJECTKEY
export_return_schema = "ALL"

# Sandbox persistence (opt-in, independent from exportFile storage).
# Keep storage settings when disabling admission while durable records remain.
persistence_enabled = false
snapshot_store_endpoint = ""
snapshot_store_region = ""
snapshot_store_bucket_name = ""
snapshot_store_prefix = "session-snapshots"
snapshot_store_ak = ""
snapshot_store_sk = ""
snapshot_store_force_path_style = false
# Only readback is supported; server checksum verification is not certified.
snapshot_store_integrity_mode = "readback"
snapshot_presign_ttl_sec = 900
snapshot_multipart_part_size_bytes = 67108864
snapshot_multipart_concurrency = 4
snapshot_max_bytes = 10737418240
snapshot_max_expanded_bytes = 53687091200
snapshot_account_quota_bytes = 107374182400
persistence_retention_ttl_sec = 604800
persistence_max_retention_ttl_sec = 2592000
persistence_operation_timeout_sec = 1800
# Expired suspended sessions and unreferenced database snapshots are collected.
snapshot_gc_interval_sec = 300
snapshot_gc_grace_sec = 86400

# MCP.
mcp_token_query_param = "token"
# Case-sensitive prefix for routing readImage/exportFile to worker-sys.
# Changing this alters session ID interpretation and is generally not recommended.
computer_use_session_id_prefix = "CU:"
# Hidden tools, equivalent to CONSOLE_HIDDEN_TOOLS="echo,pythonExec".
hidden_tools = []

# MCP tool overrides. Section keys mirror the environment variable names:
# [mcp_tool.python_exec] name/title/description
# [mcp_tool.python_exec.param.<param>] description
# An empty param description hides the parameter from tools/list.
# [mcp_tool.python_exec]
# name = "runPython"
# title = "Run Python"
# description = "Execute python code in a sandbox."
#
# [mcp_tool.python_exec.param.code]
# description = "Python source to execute."

# Logging.
log_level = "info"
log_format = "json"
log_add_source = false
