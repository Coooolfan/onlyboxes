# worker-boxlite configuration file.
# Place this file next to the worker binary as `config.toml`,
# or point `WORKER_CONFIG_FILE` at it.
# Environment variables always win over the values declared here.

# Identity (required, returned by console when creating the worker).
id = ""
secret = ""

# Console connection.
console_grpc_target = "127.0.0.1:50051"
console_insecure = false

# Registration metadata.
# The reported version comes from the binary build info and cannot be overridden.
node_name = ""

# Heartbeat and call timeouts.
heartbeat_interval_sec = 5
heartbeat_jitter_pct = 20
# call_timeout_sec defaults to ceil(2.5 * heartbeat_interval_sec).
# call_timeout_sec = 13

# boxlite runtime home, empty means boxlite default.
boxlite_home = ""

# pythonExec capability.
python_exec_boxlite_image = "ghcr.io/astral-sh/uv:python3.12-bookworm-slim"
python_exec_memory_mib = 256
python_exec_cpus = 1
python_exec_max_processes = 128

# terminalExec capability.
terminal_exec_boxlite_image = "coolfan1024/onlyboxes-runtime:default"
terminal_exec_memory_mib = 256
terminal_exec_cpus = 1
terminal_exec_max_processes = 128
terminal_lease_min_sec = 60
terminal_lease_max_sec = 1800
terminal_lease_default_sec = 60
terminal_output_limit_bytes = 1048576
# 0 means no export size limit.
terminal_export_max_bytes = 0
# Maximum active terminal sessions managed by this worker.
# 0 means unlimited.
terminal_max_active_sessions = 0
# Maximum concurrent commands in one terminal session.
terminal_session_max_inflight = 1

# Capability concurrency.
echo_max_inflight = 4
python_exec_max_inflight = 4
terminal_exec_max_inflight = 4
terminal_resource_max_inflight = 4

# Public preview proxy. sandbox_ports are the only guest ports that can be routed.
proxy_enabled = false
proxy_listen_addr = "0.0.0.0:8091"
proxy_advertise_addr = "10.20.1.16:8091"
proxy_sandbox_ports = [3000, 8080]

# Logging.
log_level = "info"
log_format = "json"
log_add_source = false

# Worker labels, equivalent to WORKER_LABELS="region=cn,owner=team-a".
[labels]
# region = "cn"
# owner = "team-a"

# Filesystem snapshot lifecycle (opt-in). The external lease companion must
# already be running for this worker ID and its provisioned store ID.
[persistence]
enabled = false
# All five homes/directories must be absolute, separate and non-nested.
# Set boxlite_home above to a private dedicated terminal SDK home.
journal_dir = ""
lease_state_dir = ""
lease_socket_dir = ""
lease_store_id = ""
python_home = ""
max_inflight = 2
# Logical reservation ceiling; admission also checks actual free disk space.
tmp_quota_bytes = 68719476736
cache_max_bytes = 4294967296
cache_ttl_sec = 3600
drain_timeout_sec = 30
readiness_timeout_sec = 30
transfer_concurrency = 4
transfer_idle_sec = 30
