[package]
name = "worker-boxlite"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Boxlite native SDK
boxlite = { version = "0.7.5", features = ["gvproxy"] }

# gRPC
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots"] }
prost = "0.13"

# Async
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Utils
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
base64 = "0.22"
thiserror = "2"
scopeguard = "1"

[features]
integration = []

[build-dependencies]
tonic-build = "0.12"
