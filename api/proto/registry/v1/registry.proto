syntax = "proto3";

package onlyboxes.registry.v1;

option go_package = "github.com/onlyboxes/onlyboxes/api/gen/go/registry/v1;registryv1";

message CapabilityDeclaration {
  string name = 1;
  int32 max_inflight = 2;
}

message TerminalSessionCapacity {
  // Zero means that active terminal sessions are unlimited.
  int32 max_active_sessions = 1;
  // Reservation count at the moment ConnectHello is built.
  int32 active_session_count = 2;
}

// Persistence is opt-in. An absent or disabled declaration cannot receive
// snapshot controls. Runtime versions refer to the backend, not worker builds.
message SandboxPersistenceCapabilities {
  bool enabled = 1;
  string runtime = 2;
  string runtime_version = 3;
  string guest_platform = 4;
  repeated string read_formats = 5;
  repeated string write_formats = 6;
  int32 max_inflight = 7;
  int64 available_staging_bytes = 8;
}

message SandboxPersistenceUsage {
  int32 inflight = 1;
  int64 available_staging_bytes = 2;
}

// Controls are separate from command dispatch and ordinary task deadlines.
// Payloads contain action-specific private metadata, never archive bytes.
message SandboxPersistenceControl {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    PREPARE_SNAPSHOT = 1;
    UPLOAD_SNAPSHOT = 2;
    VERIFY_SNAPSHOT = 3;
    FINALIZE_SUSPEND = 4;
    PREPARE_RESTORE = 5;
    RESTORE = 6;
    ACTIVATE = 7;
    CANCEL = 8;
    INSPECT = 9;
  }
  // New for each delivery. Operation/session/generation identify durable work.
  string request_id = 1;
  string operation_id = 2;
  string scoped_session_id = 3;
  int64 generation = 4;
  Action action = 5;
  int64 deadline_unix_ms = 6;
  bytes payload_json = 7;
}

message SandboxPersistenceReport {
  string request_id = 1;
  string operation_id = 2;
  string scoped_session_id = 3;
  int64 generation = 4;
  SandboxPersistenceControl.Action action = 5;
  string phase = 6;
  // Progress reports do not finish a control. Final reports must include an
  // error or a valid JSON result (including for empty results: {}).
  bool completed = 7;
  CommandError error = 8;
  bytes payload_json = 9;
}

message ConnectHello {
  string node_id = 1;
  string node_name = 2;
  string executor_kind = 3;
  map<string, string> labels = 5;
  string version = 6;
  repeated CapabilityDeclaration capabilities = 10;
  string worker_secret = 11;
  TerminalSessionCapacity terminal_session_capacity = 12;
  SandboxPersistenceCapabilities sandbox_persistence = 13;
}

message HeartbeatFrame {
  string node_id = 1;
  string session_id = 2;
  int32 active_session_count = 3;
  SandboxPersistenceUsage sandbox_persistence = 4;
}

message ConnectRequest {
  oneof payload {
    ConnectHello hello = 1;
    HeartbeatFrame heartbeat = 2;
    CommandResult command_result = 3;
    TerminalSessionRecoveryReport terminal_session_recovery_report = 4;
    SandboxPersistenceReport sandbox_persistence_report = 5;
  }
}

message TerminalSessionRecoveryCandidate {
  string session_id = 1;
  int64 lease_expires_unix_ms = 2;
}

message TerminalSessionRecoveryResult {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    RECOVERED = 1;
    MISSING = 2;
    INVALID = 3;
  }

  string session_id = 1;
  Status status = 2;
}

message TerminalSessionRecoveryReport {
  repeated TerminalSessionRecoveryResult results = 1;
}

message TerminalSessionRecoveryAck {}

message ConnectAck {
  string session_id = 1;
  int32 heartbeat_interval_sec = 3;
  repeated TerminalSessionRecoveryCandidate terminal_session_recovery_candidates = 4;
}

message HeartbeatAck {
  int32 heartbeat_interval_sec = 2;
}

message CommandDispatch {
  string command_id = 1;
  string capability = 2;
  bytes payload_json = 4;
  int64 deadline_unix_ms = 5;
}

message CommandError {
  string code = 1;
  string message = 2;
}

message CommandResult {
  string command_id = 1;
  CommandError error = 3;
  bytes payload_json = 4;
  int64 completed_unix_ms = 5;
}

message ConnectResponse {
  oneof payload {
    ConnectAck connect_ack = 1;
    HeartbeatAck heartbeat_ack = 2;
    CommandDispatch command_dispatch = 4;
    TerminalSessionRecoveryAck terminal_session_recovery_ack = 5;
    SandboxPersistenceControl sandbox_persistence_control = 6;
  }
}

service WorkerRegistryService {
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
}
