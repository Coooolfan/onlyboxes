name: Onlyboxes CD
run-name: CD ${{ inputs.version }}${{ inputs.latest && ' (latest)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.7.2 or 0.7.2-rc.1
        required: true
        type: string
      latest:
        description: Publish Docker latest, mark GitHub Release latest, and deploy website to production
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cd-${{ inputs.version }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: "24"

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      version_safe: ${{ steps.prepare.outputs.version_safe }}
      target_sha: ${{ steps.prepare.outputs.target_sha }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
      publish_latest: ${{ steps.prepare.outputs.publish_latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release context
        id: prepare
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LATEST: ${{ inputs.latest }}
          GH_TOKEN: ${{ github.token }}
        run: bash ./.github/scripts/release/prepare-release.sh

      - name: Check release defaults
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: bash ./.github/scripts/release/check-release-defaults.sh

      - name: Release summary
        run: |
          {
            echo "## Onlyboxes Release"
            echo
            echo "- Version: \`${{ steps.prepare.outputs.version }}\`"
            echo "- Workflow ref: \`${{ github.ref_name }}\`"
            echo "- Target SHA: \`${{ steps.prepare.outputs.target_sha }}\`"
            echo "- Prerelease: \`${{ steps.prepare.outputs.prerelease }}\`"
            echo "- Latest: \`${{ steps.prepare.outputs.publish_latest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  build-web:
    runs-on: ubuntu-latest
    needs: prepare-release
    env:
      VERSION_RAW: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Build web
        run: |
          set -euo pipefail
          yarn --cwd web install --immutable
          VITE_CONSOLE_VERSION="${VERSION_RAW}" yarn --cwd web build

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build-website:
    runs-on: ubuntu-latest
    needs: prepare-release
    defaults:
      run:
        working-directory: ./website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Build website
        run: |
          set -euo pipefail
          yarn install --immutable
          yarn build

      - name: Upload website dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          if-no-files-found: error

  build-console:
    name: console (${{ matrix.os_name }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    needs:
      - prepare-release
      - build-web
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os_name: linux
            goos: linux
            goarch: amd64
          - arch: arm64
            os_name: linux
            goos: linux
            goarch: arm64
          - arch: x64
            os_name: macos
            goos: darwin
            goarch: amd64
          - arch: arm64
            os_name: macos
            goos: darwin
            goarch: arm64
    env:
      VERSION_RAW: ${{ needs.prepare-release.outputs.version }}
      VERSION_SAFE: ${{ needs.prepare-release.outputs.version_safe }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CONSOLE_BIN: onlyboxes-console_${{ needs.prepare-release.outputs.version_safe }}_${{ matrix.os_name }}_${{ matrix.goarch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Download web dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: console/internal/httpapi/web_dist

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: console/go.sum

      - name: Build console binary
        run: |
          set -euo pipefail
          mkdir -p build
          (
            cd console
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath \
              -ldflags "-X github.com/onlyboxes/onlyboxes/console/internal/buildinfo.Version=${VERSION_RAW}" \
              -o "../build/${CONSOLE_BIN}" \
              ./cmd/console
          )

      - name: Validate console binary architecture
        run: |
          set -euo pipefail
          console_info="$(file "build/${CONSOLE_BIN}")"
          echo "${console_info}"
          case "${GOOS}/${GOARCH}" in
            linux/amd64)
              grep -Eq "ELF 64-bit.*x86-64" <<< "${console_info}"
              ;;
            linux/arm64)
              grep -Eq "ELF 64-bit.*ARM aarch64" <<< "${console_info}"
              ;;
            darwin/amd64)
              grep -Eq "Mach-O 64-bit.*x86_64" <<< "${console_info}"
              ;;
            darwin/arm64)
              grep -Eq "Mach-O 64-bit.*arm64" <<< "${console_info}"
              ;;
            *)
              echo "unsupported target: ${GOOS}/${GOARCH}" >&2
              exit 1
              ;;
          esac

      - name: Upload console binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: onlyboxes-console-${{ matrix.os_name }}-${{ matrix.arch }}-${{ env.VERSION_SAFE }}
          path: build/${{ env.CONSOLE_BIN }}
          if-no-files-found: error

  build-worker-docker:
    name: worker-docker (${{ matrix.os_name }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    needs: prepare-release
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os_name: linux
            goos: linux
            goarch: amd64
          - arch: arm64
            os_name: linux
            goos: linux
            goarch: arm64
          - arch: x64
            os_name: macos
            goos: darwin
            goarch: amd64
          - arch: arm64
            os_name: macos
            goos: darwin
            goarch: arm64
    env:
      VERSION_RAW: ${{ needs.prepare-release.outputs.version }}
      VERSION_SAFE: ${{ needs.prepare-release.outputs.version_safe }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      WORKER_BIN: onlyboxes-worker-docker_${{ needs.prepare-release.outputs.version_safe }}_${{ matrix.os_name }}_${{ matrix.goarch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: worker/worker-docker/go.sum

      - name: Build worker binary
        run: |
          set -euo pipefail
          mkdir -p build
          (
            cd worker/worker-docker
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath \
              -ldflags "-X github.com/onlyboxes/onlyboxes/worker/worker-docker/internal/buildinfo.Version=${VERSION_RAW}" \
              -o "../../build/${WORKER_BIN}" \
              ./cmd/worker-docker
          )

      - name: Validate worker binary architecture
        run: |
          set -euo pipefail
          worker_info="$(file "build/${WORKER_BIN}")"
          echo "${worker_info}"
          case "${GOOS}/${GOARCH}" in
            linux/amd64)
              grep -Eq "ELF 64-bit.*x86-64" <<< "${worker_info}"
              ;;
            linux/arm64)
              grep -Eq "ELF 64-bit.*ARM aarch64" <<< "${worker_info}"
              ;;
            darwin/amd64)
              grep -Eq "Mach-O 64-bit.*x86_64" <<< "${worker_info}"
              ;;
            darwin/arm64)
              grep -Eq "Mach-O 64-bit.*arm64" <<< "${worker_info}"
              ;;
            *)
              echo "unsupported target: ${GOOS}/${GOARCH}" >&2
              exit 1
              ;;
          esac

      - name: Upload worker binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: onlyboxes-worker-docker-${{ matrix.os_name }}-${{ matrix.arch }}-${{ env.VERSION_SAFE }}
          path: build/${{ env.WORKER_BIN }}
          if-no-files-found: error

  build-worker-sys:
    name: worker-sys (${{ matrix.os_name }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    needs: prepare-release
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os_name: linux
            goos: linux
            goarch: amd64
            ext: ""
          - arch: arm64
            os_name: linux
            goos: linux
            goarch: arm64
            ext: ""
          - arch: x64
            os_name: macos
            goos: darwin
            goarch: amd64
            ext: ""
          - arch: arm64
            os_name: macos
            goos: darwin
            goarch: arm64
            ext: ""
          - arch: x64
            os_name: windows
            goos: windows
            goarch: amd64
            ext: ".exe"
          - arch: arm64
            os_name: windows
            goos: windows
            goarch: arm64
            ext: ".exe"
    env:
      VERSION_RAW: ${{ needs.prepare-release.outputs.version }}
      VERSION_SAFE: ${{ needs.prepare-release.outputs.version_safe }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      WORKER_BIN: onlyboxes-worker-sys_${{ needs.prepare-release.outputs.version_safe }}_${{ matrix.os_name }}_${{ matrix.goarch }}${{ matrix.ext }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: worker/worker-sys/go.sum

      - name: Build worker binary
        run: |
          set -euo pipefail
          mkdir -p build
          (
            cd worker/worker-sys
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath \
              -ldflags "-X github.com/onlyboxes/onlyboxes/worker/worker-sys/internal/buildinfo.Version=${VERSION_RAW}" \
              -o "../../build/${WORKER_BIN}" \
              ./cmd/worker-sys
          )

      - name: Validate worker binary architecture
        run: |
          set -euo pipefail
          worker_info="$(file "build/${WORKER_BIN}")"
          echo "${worker_info}"
          case "${GOOS}/${GOARCH}" in
            linux/amd64)
              grep -Eq "ELF 64-bit.*x86-64" <<< "${worker_info}"
              ;;
            linux/arm64)
              grep -Eq "ELF 64-bit.*ARM aarch64" <<< "${worker_info}"
              ;;
            darwin/amd64)
              grep -Eq "Mach-O 64-bit.*x86_64" <<< "${worker_info}"
              ;;
            darwin/arm64)
              grep -Eq "Mach-O 64-bit.*arm64" <<< "${worker_info}"
              ;;
            windows/amd64)
              grep -Eq "PE32\+ executable.*x86-64" <<< "${worker_info}"
              ;;
            windows/arm64)
              grep -Eq "PE32\+ executable.*Aarch64|PE32\+ executable.*ARM64" <<< "${worker_info}"
              ;;
            *)
              echo "unsupported target: ${GOOS}/${GOARCH}" >&2
              exit 1
              ;;
          esac

      - name: Upload worker binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: onlyboxes-worker-sys-${{ matrix.os_name }}-${{ matrix.arch }}-${{ env.VERSION_SAFE }}
          path: build/${{ env.WORKER_BIN }}
          if-no-files-found: error

  build-worker-boxlite:
    name: worker-boxlite (${{ matrix.os_name }}/${{ matrix.arch_name }})
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            os_name: linux
            arch_name: amd64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: arm64
            os_name: linux
            arch_name: arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            arch: arm64
            os_name: macos
            arch_name: arm64
            target: aarch64-apple-darwin
    env:
      VERSION_RAW: ${{ needs.prepare-release.outputs.version }}
      VERSION_SAFE: ${{ needs.prepare-release.outputs.version_safe }}
      WORKER_BIN: onlyboxes-worker-boxlite_${{ needs.prepare-release.outputs.version_safe }}_${{ matrix.os_name }}_${{ matrix.arch_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            worker/worker-boxlite/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('worker/worker-boxlite/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.target }}-

      - name: Build worker-boxlite binary
        run: |
          set -euo pipefail
          cd worker/worker-boxlite
          ONLYBOXES_WORKER_BOXLITE_VERSION="${VERSION_RAW}" \
            cargo build --release --target "${{ matrix.target }}"

      - name: Copy and validate binary
        run: |
          set -euo pipefail
          mkdir -p build
          cp "worker/worker-boxlite/target/${{ matrix.target }}/release/worker-boxlite" "build/${WORKER_BIN}"
          worker_info="$(file "build/${WORKER_BIN}")"
          echo "${worker_info}"
          case "${{ matrix.os_name }}/${{ matrix.arch_name }}" in
            linux/amd64)
              grep -Eq "ELF 64-bit.*x86-64" <<< "${worker_info}"
              ;;
            linux/arm64)
              grep -Eq "ELF 64-bit.*ARM aarch64" <<< "${worker_info}"
              ;;
            macos/arm64)
              grep -Eq "Mach-O 64-bit executable arm64" <<< "${worker_info}"
              ;;
            *)
              echo "unsupported target: ${{ matrix.os_name }}/${{ matrix.arch_name }}" >&2
              exit 1
              ;;
          esac

      - name: Upload worker-boxlite binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: onlyboxes-worker-boxlite-${{ matrix.os_name }}-${{ matrix.arch }}-${{ env.VERSION_SAFE }}
          path: build/${{ env.WORKER_BIN }}
          if-no-files-found: error

  create-draft-release:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-console
      - build-worker-docker
      - build-worker-sys
      - build-worker-boxlite
      - build-website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          TARGET_SHA: ${{ needs.prepare-release.outputs.target_sha }}
          PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
        run: bash ./.github/scripts/release/create-draft-release.sh

  upload-release-assets:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - create-draft-release
      - build-console
      - build-worker-docker
      - build-worker-sys
      - build-worker-boxlite
    env:
      VERSION_RAW: ${{ needs.prepare-release.outputs.version }}
      VERSION_SAFE: ${{ needs.prepare-release.outputs.version_safe }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: onlyboxes-*-${{ env.VERSION_SAFE }}
          path: dist/artifacts

      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets
          while IFS= read -r -d '' file; do
            chmod 755 "$file"
            asset="dist/release-assets/$(basename "$file").zip"
            zip -q -j "$asset" "$file"
          done < <(find dist/artifacts -type f -print0 | sort -z)
          ls -al dist/release-assets

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${VERSION_RAW}" dist/release-assets/*.zip --clobber

  deploy-website-cloudflare:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - create-draft-release
      - build-website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Download website dist artifact
        uses: actions/download-artifact@v4
        with:
          name: website-dist
          path: website/dist

      - name: Upload website version without production traffic
        if: needs.prepare-release.outputs.publish_latest != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --tag ${{ needs.prepare-release.outputs.version }} --message "Release ${{ needs.prepare-release.outputs.version }}"

      - name: Deploy website to production
        if: needs.prepare-release.outputs.publish_latest == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  push-console-image:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-console
      - create-draft-release
    env:
      VERSION_SAFE: ${{ needs.prepare-release.outputs.version_safe }}
      PUBLISH_LATEST: ${{ needs.prepare-release.outputs.publish_latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Download console linux x64 binary artifact
        uses: actions/download-artifact@v4
        with:
          name: onlyboxes-console-linux-x64-${{ env.VERSION_SAFE }}
          path: build/console-linux-x64

      - name: Download console linux arm64 binary artifact
        uses: actions/download-artifact@v4
        with:
          name: onlyboxes-console-linux-arm64-${{ env.VERSION_SAFE }}
          path: build/console-linux-arm64

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Docker tags
        id: docker_tags
        run: |
          set -euo pipefail
          image_repo="coolfan1024/onlyboxes"

          console_tags="${image_repo}:${VERSION_SAFE}"
          if [[ "${PUBLISH_LATEST}" == "true" ]]; then
            console_tags+=$'\n'"${image_repo}:latest"
          fi

          {
            echo "console_tags<<EOF"
            echo "${console_tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare Docker build context
        run: |
          set -euo pipefail
          mkdir -p build/docker/console
          cp "build/console-linux-x64/onlyboxes-console_${VERSION_SAFE}_linux_amd64" "build/docker/console/onlyboxes-console-amd64"
          cp "build/console-linux-arm64/onlyboxes-console_${VERSION_SAFE}_linux_arm64" "build/docker/console/onlyboxes-console-arm64"
          cp docker/console.dockerfile "build/docker/console/Dockerfile"

      - name: Build and push console image
        uses: docker/build-push-action@v6
        with:
          context: build/docker/console
          file: build/docker/console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_tags.outputs.console_tags }}

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - upload-release-assets
      - deploy-website-cloudflare
      - push-console-image
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.target_sha }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
          PUBLISH_LATEST: ${{ needs.prepare-release.outputs.publish_latest }}
        run: bash ./.github/scripts/release/publish-release.sh
