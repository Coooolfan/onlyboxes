name: package-release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version_raw: ${{ steps.version.outputs.version_raw }}
      version_safe: ${{ steps.version.outputs.version_safe }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_raw="${GITHUB_REF_NAME}"
          if [[ -z "${version_raw}" ]]; then
            echo "version is required" >&2
            exit 1
          fi

          version_safe="$(printf '%s' "${version_raw}" | sed -E 's/[^A-Za-z0-9._-]+/-/g')"
          if [[ -z "${version_safe}" ]]; then
            echo "sanitized version is empty" >&2
            exit 1
          fi

          if [[ "${version_raw}" =~ -(rc|beta|alpha)[.-] ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          {
            echo "version_raw=${version_raw}"
            echo "version_safe=${version_safe}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify release notes file
        shell: bash
        run: |
          notes="docs/release_notes/${GITHUB_REF_NAME}.md"
          if [[ ! -f "${notes}" ]]; then
            echo "::error::Release notes file not found: ${notes}" >&2
            exit 1
          fi

  create-draft-release:
    name: Create draft release
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare-release.outputs.version_raw }}
          name: ${{ needs.prepare-release.outputs.version_raw }}
          body_path: docs/release_notes/${{ needs.prepare-release.outputs.version_raw }}.md
          prerelease: ${{ needs.prepare-release.outputs.prerelease == 'true' }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - create-draft-release
    env:
      VERSION_RAW: ${{ needs.prepare-release.outputs.version_raw }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Build web
        run: |
          set -euo pipefail
          yarn --cwd web install --immutable
          VITE_CONSOLE_VERSION="${VERSION_RAW}" yarn --cwd web build

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build-website:
    name: Build website
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - create-draft-release
    env:
      VERSION_RAW: ${{ needs.prepare-release.outputs.version_raw }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Build website
        run: |
          set -euo pipefail
          yarn --cwd website install --immutable
          VITE_DEFAULT_TAG="${VERSION_RAW}" yarn --cwd website build

      - name: Upload website dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: website-dist
          path: website/dist
          if-no-files-found: error

  build-console:
    name: console (${{ matrix.os_name }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    needs:
      - prepare-release
      - build-web
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os_name: linux
            goos: linux
            goarch: amd64
          - arch: arm64
            os_name: linux
            goos: linux
            goarch: arm64
          - arch: x64
            os_name: macos
            goos: darwin
            goarch: amd64
          - arch: arm64
            os_name: macos
            goos: darwin
            goarch: arm64
    env:
      VERSION_RAW: ${{ needs.prepare-release.outputs.version_raw }}
      VERSION_SAFE: ${{ needs.prepare-release.outputs.version_safe }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CONSOLE_BIN: onlyboxes-console_${{ needs.prepare-release.outputs.version_safe }}_${{ matrix.os_name }}_${{ matrix.goarch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download web dist artifact
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: console/internal/httpapi/web_dist

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: console/go.sum

      - name: Build console binary
        run: |
          set -euo pipefail
          mkdir -p build
          (
            cd console
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath \
              -ldflags "-X github.com/onlyboxes/onlyboxes/console/internal/buildinfo.Version=${VERSION_RAW}" \
              -o "../build/${CONSOLE_BIN}" \
              ./cmd/console
          )

      - name: Validate console binary architecture
        run: |
          set -euo pipefail
          console_info="$(file "build/${CONSOLE_BIN}")"
          echo "${console_info}"
          case "${GOOS}/${GOARCH}" in
            linux/amd64)
              grep -Eq "ELF 64-bit.*x86-64" <<< "${console_info}"
              ;;
            linux/arm64)
              grep -Eq "ELF 64-bit.*ARM aarch64" <<< "${console_info}"
              ;;
            darwin/amd64)
              grep -Eq "Mach-O 64-bit.*x86_64" <<< "${console_info}"
              ;;
            darwin/arm64)
              grep -Eq "Mach-O 64-bit.*arm64" <<< "${console_info}"
              ;;
            *)
              echo "unsupported target: ${GOOS}/${GOARCH}" >&2
              exit 1
              ;;
          esac

      - name: Upload console workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: onlyboxes-console-${{ matrix.os_name }}-${{ matrix.arch }}-${{ env.VERSION_SAFE }}.zip
          path: build/${{ env.CONSOLE_BIN }}
          if-no-files-found: error

      - name: Upload console release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (
            cd build
            zip -q -j "${CONSOLE_BIN}.zip" "${CONSOLE_BIN}"
          )
          gh release upload "${VERSION_RAW}" "build/${CONSOLE_BIN}.zip" --clobber

  build-worker-docker:
    name: worker-docker (${{ matrix.os_name }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    needs:
      - prepare-release
      - create-draft-release
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os_name: linux
            goos: linux
            goarch: amd64
          - arch: arm64
            os_name: linux
            goos: linux
            goarch: arm64
          - arch: x64
            os_name: macos
            goos: darwin
            goarch: amd64
          - arch: arm64
            os_name: macos
            goos: darwin
            goarch: arm64
    env:
      VERSION_RAW: ${{ needs.prepare-release.outputs.version_raw }}
      VERSION_SAFE: ${{ needs.prepare-release.outputs.version_safe }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      WORKER_BIN: onlyboxes-worker-docker_${{ needs.prepare-release.outputs.version_safe }}_${{ matrix.os_name }}_${{ matrix.goarch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: worker/worker-docker/go.sum

      - name: Build worker binary
        run: |
          set -euo pipefail
          mkdir -p build
          (
            cd worker/worker-docker
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath \
              -ldflags "-X github.com/onlyboxes/onlyboxes/worker/worker-docker/internal/buildinfo.Version=${VERSION_RAW}" \
              -o "../../build/${WORKER_BIN}" \
              ./cmd/worker-docker
          )

      - name: Validate worker binary architecture
        run: |
          set -euo pipefail
          worker_info="$(file "build/${WORKER_BIN}")"
          echo "${worker_info}"
          case "${GOOS}/${GOARCH}" in
            linux/amd64)
              grep -Eq "ELF 64-bit.*x86-64" <<< "${worker_info}"
              ;;
            linux/arm64)
              grep -Eq "ELF 64-bit.*ARM aarch64" <<< "${worker_info}"
              ;;
            darwin/amd64)
              grep -Eq "Mach-O 64-bit.*x86_64" <<< "${worker_info}"
              ;;
            darwin/arm64)
              grep -Eq "Mach-O 64-bit.*arm64" <<< "${worker_info}"
              ;;
            *)
              echo "unsupported target: ${GOOS}/${GOARCH}" >&2
              exit 1
              ;;
          esac

      - name: Upload worker workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: onlyboxes-worker-docker-${{ matrix.os_name }}-${{ matrix.arch }}-${{ env.VERSION_SAFE }}.zip
          path: build/${{ env.WORKER_BIN }}
          if-no-files-found: error

      - name: Upload worker release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (
            cd build
            zip -q -j "${WORKER_BIN}.zip" "${WORKER_BIN}"
          )
          gh release upload "${VERSION_RAW}" "build/${WORKER_BIN}.zip" --clobber

  build-worker-sys:
    name: worker-sys (${{ matrix.os_name }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    needs:
      - prepare-release
      - create-draft-release
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os_name: linux
            goos: linux
            goarch: amd64
            ext: ""
          - arch: arm64
            os_name: linux
            goos: linux
            goarch: arm64
            ext: ""
          - arch: x64
            os_name: macos
            goos: darwin
            goarch: amd64
            ext: ""
          - arch: arm64
            os_name: macos
            goos: darwin
            goarch: arm64
            ext: ""
          - arch: x64
            os_name: windows
            goos: windows
            goarch: amd64
            ext: ".exe"
          - arch: arm64
            os_name: windows
            goos: windows
            goarch: arm64
            ext: ".exe"
    env:
      VERSION_RAW: ${{ needs.prepare-release.outputs.version_raw }}
      VERSION_SAFE: ${{ needs.prepare-release.outputs.version_safe }}
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      WORKER_BIN: onlyboxes-worker-sys_${{ needs.prepare-release.outputs.version_safe }}_${{ matrix.os_name }}_${{ matrix.goarch }}${{ matrix.ext }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: worker/worker-sys/go.sum

      - name: Build worker binary
        run: |
          set -euo pipefail
          mkdir -p build
          (
            cd worker/worker-sys
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" go build -trimpath \
              -ldflags "-X github.com/onlyboxes/onlyboxes/worker/worker-sys/internal/buildinfo.Version=${VERSION_RAW}" \
              -o "../../build/${WORKER_BIN}" \
              ./cmd/worker-sys
          )

      - name: Validate worker binary architecture
        run: |
          set -euo pipefail
          worker_info="$(file "build/${WORKER_BIN}")"
          echo "${worker_info}"
          case "${GOOS}/${GOARCH}" in
            linux/amd64)
              grep -Eq "ELF 64-bit.*x86-64" <<< "${worker_info}"
              ;;
            linux/arm64)
              grep -Eq "ELF 64-bit.*ARM aarch64" <<< "${worker_info}"
              ;;
            darwin/amd64)
              grep -Eq "Mach-O 64-bit.*x86_64" <<< "${worker_info}"
              ;;
            darwin/arm64)
              grep -Eq "Mach-O 64-bit.*arm64" <<< "${worker_info}"
              ;;
            windows/amd64)
              grep -Eq "PE32\+ executable.*x86-64" <<< "${worker_info}"
              ;;
            windows/arm64)
              grep -Eq "PE32\+ executable.*Aarch64|PE32\+ executable.*ARM64" <<< "${worker_info}"
              ;;
            *)
              echo "unsupported target: ${GOOS}/${GOARCH}" >&2
              exit 1
              ;;
          esac

      - name: Upload worker workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: onlyboxes-worker-sys-${{ matrix.os_name }}-${{ matrix.arch }}-${{ env.VERSION_SAFE }}.zip
          path: build/${{ env.WORKER_BIN }}
          if-no-files-found: error

      - name: Upload worker release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (
            cd build
            zip -q -j "${WORKER_BIN}.zip" "${WORKER_BIN}"
          )
          gh release upload "${VERSION_RAW}" "build/${WORKER_BIN}.zip" --clobber

  build-worker-boxlite:
    name: worker-boxlite (${{ matrix.os_name }}/${{ matrix.arch_name }})
    runs-on: ${{ matrix.os }}
    needs:
      - prepare-release
      - create-draft-release
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            os_name: linux
            arch_name: amd64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: arm64
            os_name: linux
            arch_name: arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            arch: arm64
            os_name: macos
            arch_name: arm64
            target: aarch64-apple-darwin
    env:
      VERSION_RAW: ${{ needs.prepare-release.outputs.version_raw }}
      VERSION_SAFE: ${{ needs.prepare-release.outputs.version_safe }}
      WORKER_BIN: onlyboxes-worker-boxlite_${{ needs.prepare-release.outputs.version_safe }}_${{ matrix.os_name }}_${{ matrix.arch_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install protoc
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y protobuf-compiler
              ;;
            macOS)
              brew install protobuf
              ;;
            *)
              echo "unsupported runner OS: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac
          protoc --version

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            worker/worker-boxlite/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('worker/worker-boxlite/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.target }}-

      - name: Build worker-boxlite binary
        run: |
          set -euo pipefail
          cd worker/worker-boxlite
          ONLYBOXES_WORKER_BOXLITE_VERSION="${VERSION_RAW}" \
            cargo build --release --target "${{ matrix.target }}"

      - name: Copy and validate binary
        run: |
          set -euo pipefail
          mkdir -p build
          cp "worker/worker-boxlite/target/${{ matrix.target }}/release/worker-boxlite" "build/${WORKER_BIN}"
          worker_info="$(file "build/${WORKER_BIN}")"
          echo "${worker_info}"
          case "${{ matrix.os_name }}/${{ matrix.arch_name }}" in
            linux/amd64)
              grep -Eq "ELF 64-bit.*x86-64" <<< "${worker_info}"
              ;;
            linux/arm64)
              grep -Eq "ELF 64-bit.*ARM aarch64" <<< "${worker_info}"
              ;;
            macos/arm64)
              grep -Eq "Mach-O 64-bit executable arm64" <<< "${worker_info}"
              ;;
            *)
              echo "unsupported target: ${{ matrix.os_name }}/${{ matrix.arch_name }}" >&2
              exit 1
              ;;
          esac

      - name: Upload worker-boxlite workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: onlyboxes-worker-boxlite-${{ matrix.os_name }}-${{ matrix.arch }}-${{ env.VERSION_SAFE }}.zip
          path: build/${{ env.WORKER_BIN }}
          if-no-files-found: error

      - name: Upload worker-boxlite release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (
            cd build
            zip -q -j "${WORKER_BIN}.zip" "${WORKER_BIN}"
          )
          gh release upload "${VERSION_RAW}" "build/${WORKER_BIN}.zip" --clobber

  push-console-image:
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-console
    env:
      VERSION_SAFE: ${{ needs.prepare-release.outputs.version_safe }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download console linux x64 binary artifact
        uses: actions/download-artifact@v8
        with:
          name: onlyboxes-console-linux-x64-${{ env.VERSION_SAFE }}.zip
          path: build/console-linux-x64

      - name: Download console linux arm64 binary artifact
        uses: actions/download-artifact@v8
        with:
          name: onlyboxes-console-linux-arm64-${{ env.VERSION_SAFE }}.zip
          path: build/console-linux-arm64

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve Docker tags
        id: docker_tags
        env:
          IS_PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
        run: |
          set -euo pipefail
          image_repo="coolfan1024/onlyboxes"

          console_tags="${image_repo}:${VERSION_SAFE}"
          if [[ "${IS_PRERELEASE}" != "true" ]]; then
            console_tags+=$'\n'"${image_repo}:latest"
          fi

          {
            echo "console_tags<<EOF"
            echo "${console_tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare Docker build context
        run: |
          set -euo pipefail
          mkdir -p build/docker/console
          cp "build/console-linux-x64/onlyboxes-console_${VERSION_SAFE}_linux_amd64" "build/docker/console/onlyboxes-console-amd64"
          cp "build/console-linux-arm64/onlyboxes-console_${VERSION_SAFE}_linux_arm64" "build/docker/console/onlyboxes-console-arm64"
          cp docker/console.dockerfile "build/docker/console/Dockerfile"

      - name: Build and push console image
        uses: docker/build-push-action@v7
        with:
          context: build/docker/console
          file: build/docker/console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_tags.outputs.console_tags }}

  push-runtime-images:
    name: runtime image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - create-draft-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            dockerfile: docker/default-work-image/global.dockerfile
            alias_tag: default
            latest: true
          - variant: default-cn
            dockerfile: docker/default-work-image/cn.dockerfile
            alias_tag: default-cn
            latest: false
          - variant: lobehub
            dockerfile: docker/lobehub-sandbox-image.dockerfile
            alias_tag: lobehub
            latest: false
    env:
      VERSION_SAFE: ${{ needs.prepare-release.outputs.version_safe }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve runtime Docker tags
        id: docker_tags
        env:
          ALIAS_TAG: ${{ matrix.alias_tag }}
          IS_LATEST: ${{ matrix.latest }}
          IS_PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
        run: |
          set -euo pipefail
          image_repo="coolfan1024/onlyboxes-runtime"

          runtime_tags="${image_repo}:${VERSION_SAFE}-${ALIAS_TAG}"
          if [[ "${IS_PRERELEASE}" != "true" ]]; then
            runtime_tags+=$'\n'"${image_repo}:${ALIAS_TAG}"
            if [[ "${IS_LATEST}" == "true" ]]; then
              runtime_tags+=$'\n'"${image_repo}:latest"
            fi
          fi

          {
            echo "runtime_tags<<EOF"
            echo "${runtime_tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_tags.outputs.runtime_tags }}

  deploy-cloudflare:
    name: Deploy website to Cloudflare
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Download website dist artifact
        uses: actions/download-artifact@v8
        with:
          name: website-dist
          path: website/dist

      - name: Upload preview version (prerelease, no traffic switch)
        if: needs.prepare-release.outputs.prerelease == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: website
          command: versions upload --tag ${{ needs.prepare-release.outputs.version_raw }} --message "Prerelease ${{ needs.prepare-release.outputs.version_raw }}"

      - name: Deploy to production (100% traffic)
        if: needs.prepare-release.outputs.prerelease != 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: website
          command: deploy

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-console
      - build-worker-docker
      - build-worker-sys
      - build-worker-boxlite
      - push-console-image
      - push-runtime-images
      - deploy-cloudflare
    steps:
      - name: Mark release as published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_RAW: ${{ needs.prepare-release.outputs.version_raw }}
          IS_PRERELEASE: ${{ needs.prepare-release.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "${IS_PRERELEASE}" == "true" ]]; then
            gh release edit "${VERSION_RAW}" --draft=false --prerelease --repo "${GITHUB_REPOSITORY}"
          else
            gh release edit "${VERSION_RAW}" --draft=false --latest --repo "${GITHUB_REPOSITORY}"
          fi
